pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Stage 3: MPAndroidChart is published on JitPack only. Restricted to its own group so no
        // other dependency can ever be resolved from this repository.
        maven {
            url 'https://jitpack.io'
            content {
                includeGroupByRegex "com\\.github\\.[Pp]hil[Jj]ay"
            }
        }
    }
}
rootProject.name = "Personal Expense Tracker and Budget Planning"
include ':app'
